[custom]
;不要随意改变关键字，否则会导致出错
;保守分流：只有确定属于国内的才直连；国外明确非 AI 的走搬瓦工，其余（AI + 兜底）走住宅
;依赖本地覆写定义 🏠 住宅代理 组，单独加载会报找不到组，必须配合覆写使用
;回滚：切回 ACL4SSR_Online.ini 生成的配置

; ① AI：必须排在所有直连规则前面
ruleset=💬 AI,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=💬 AI,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list
ruleset=💬 AI,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Gemini.list
ruleset=💬 AI,https://raw.githubusercontent.com/dhslegen/ACL4SSR/master/Clash/AISupplement.list
; ② 信任进程直连
ruleset=🎯 直连,https://raw.githubusercontent.com/dhslegen/ACL4SSR/master/Clash/ProcessDirect.list
; ③ 广告拦截
ruleset=🛑 拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
; ④ Apple / Microsoft 官方更新与同步
ruleset=🍎 系统服务,https://raw.githubusercontent.com/dhslegen/ACL4SSR/master/Clash/SystemDirect.list
; ⑤ 国内
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🎯 直连,https://raw.githubusercontent.com/dhslegen/ACL4SSR/master/Clash/DirectSupplement.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/BilibiliHMT.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Bilibili.list
ruleset=🎯 直连,[]GEOIP,CN
; ⑥ 国外白名单（明确非 AI）
ruleset=🌐 国外白名单,https://raw.githubusercontent.com/dhslegen/ACL4SSR/master/Clash/ForeignWhite.list
; ⑦ 兜底
ruleset=🐟 兜底,[]FINAL

; 🏠 住宅代理 为占位组，只在本地覆写中定义（含住宅节点凭据），线上不定义
custom_proxy_group=💬 AI`select`[]🏠 住宅代理
custom_proxy_group=🐟 兜底`select`[]🏠 住宅代理
custom_proxy_group=🌐 国外白名单`select`.*
custom_proxy_group=🍎 系统服务`select`[]DIRECT`[]🌐 国外白名单
custom_proxy_group=🎯 直连`select`[]DIRECT
custom_proxy_group=🛑 拦截`select`[]REJECT`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
